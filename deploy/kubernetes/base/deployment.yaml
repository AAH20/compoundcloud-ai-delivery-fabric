apiVersion: apps/v1
kind: Deployment
metadata:
  name: compoundcloud-control-plane
  labels: {app.kubernetes.io/name: compoundcloud, app.kubernetes.io/part-of: enterprise-ai-platform}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: compoundcloud}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: compoundcloud}
    spec:
      serviceAccountName: compoundcloud
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: control-plane
          image: ghcr.io/aah20/compoundcloud-ai-delivery-fabric:0.2.0
          args: ["serve", "--port", "8080"]
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /ready, port: http}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 15}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: compoundcloud}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata: {name: compoundcloud}
spec:
  selector: {app.kubernetes.io/name: compoundcloud}
  ports: [{name: http, port: 80, targetPort: http}]
