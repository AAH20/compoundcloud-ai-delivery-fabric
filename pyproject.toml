[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compoundcloud"
version = "0.1.0"
description = "Revenue-aware AI workload architecture compiler and benchmark fabric"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "A2Z SOC"}]
dependencies = []

[project.scripts]
compoundcloud = "compoundcloud.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

